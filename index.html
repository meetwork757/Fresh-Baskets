<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fresh Basket</title>
  <style>
    :root { --ink:#1b2418; --muted:#66715f; --paper:#f3f6ee; --card:#fff; --line:#d7e0cf; --leaf:#2f6b3a; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Georgia, serif; background:var(--paper); color:var(--ink); }
    .app { width:min(430px,100%); margin:0 auto; min-height:100vh; padding:22px 18px 40px; }
    h1 { font-size:2.1rem; line-height:1; margin:8px 0; }
    .kicker { letter-spacing:.14em; text-transform:uppercase; font-size:.72rem; color:var(--leaf); font-family:sans-serif; }
    .muted { color:var(--muted); font-family:sans-serif; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px; margin:12px 0; }
    label { display:block; font-size:.82rem; color:var(--muted); margin:10px 0 6px; font-family:sans-serif; }
    input, select { width:100%; border:1px solid var(--line); border-radius:14px; padding:12px; font:inherit; }
    button { width:100%; border:0; border-radius:999px; padding:13px; background:var(--leaf); color:#fff; font:inherit; margin-top:12px; }
    button.ghost { background:transparent; color:var(--leaf); border:1.5px solid var(--leaf); }
    .mark { width:42px; height:42px; border-radius:14px; background:var(--leaf); color:#fff; display:grid; place-items:center; }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <script>
    const db = () => JSON.parse(localStorage.getItem("freshbasket") || '{"prices":[],"orders":[]}');
    const save = (d) => localStorage.setItem("freshbasket", JSON.stringify(d));
    let area = localStorage.getItem("fb_area") || "";
    function esc(v){ return String(v??"").replace(/[&<>"]/g, c => ({'&':'&','<':'<','>':'>','"':'"'}[c])); }
    function render(){
      const data = db();
      const prices = data.prices.filter(p => !area || p.area.toLowerCase() === area.toLowerCase());
      const orders = data.orders.filter(o => !area || o.area.toLowerCase() === area.toLowerCase());
      document.getElementById("app").innerHTML = `
        <div class="mark">B</div>
        <p class="kicker">Fresh Basket</p>
        <h1>See today's market price. Buy together.</h1>
        <p class="muted">Post a price from your market, or join a group order so the cost is shared.</p>
        <form id="area" class="card"><label>Your area</label><input name="area" value="${esc(area)}" placeholder="Ogui Road, Enugu"><button>Save area</button></form>
        <form id="price" class="card"><h2>Post a price</h2><label>Item</label><input name="item" required placeholder="Rice"><label>Price</label><input name="price" required placeholder="₦850 / cup"><label>Market</label><input name="market" required><button>Post price</button></form>
        <h2>Prices near you</h2>
        ${prices.map(p=>`<div class="card"><b>${esc(p.item)}</b><p>${esc(p.price)}</p><p class="muted">${esc(p.market)} · ${esc(p.area)}</p></div>`).join("") || `<p class="muted">No prices yet for this area.</p>`}
        <form id="order" class="card"><h2>Start a group order</h2><label>Item</label><input name="item" required><label>Target people</label><input name="target" type="number" min="2" value="5"><button>Open order</button></form>
        <h2>Open group orders</h2>
        ${orders.map(o=>`<div class="card"><b>${esc(o.item)}</b><p>${o.joined} of ${o.target} joined</p><button data-id="${o.id}">I want in</button></div>`).join("") || `<p class="muted">No open orders yet.</p>`}`;
      document.getElementById("area").onsubmit = (e) => { e.preventDefault(); area = new FormData(e.target).get("area").trim(); localStorage.setItem("fb_area", area); render(); };
      document.getElementById("price").onsubmit = (e) => { e.preventDefault(); const fd=new FormData(e.target); const d=db(); d.prices.unshift({item:fd.get("item"), price:fd.get("price"), market:fd.get("market"), area:area||"General"}); save(d); render(); };
      document.getElementById("order").onsubmit = (e) => { e.preventDefault(); const fd=new FormData(e.target); const d=db(); d.orders.unshift({id:Date.now(), item:fd.get("item"), target:Number(fd.get("target")), joined:1, area:area||"General"}); save(d); render(); };
      document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => { const d=db(); const o=d.orders.find(x=>x.id==Number(b.dataset.id)); o.joined += 1; save(d); render(); });
    }
    render();
  </script>
</body>
</html>
